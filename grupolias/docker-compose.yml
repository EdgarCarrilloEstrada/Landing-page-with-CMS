services:
  web:
    build: .
    container_name: grupolias_web
    command: >
      sh -c "python manage.py migrate &&
             gunicorn grupolias.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environments:
      DJANGO_SETTINGS_MODULE: grupolias.settings.production
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: grupolias_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: