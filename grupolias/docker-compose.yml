services:
  web:
    build: .
    container_name: grupolias_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: grupolias.settings.production
    volumes:
      - /var/www/grupolias/static:/app/static
      - /var/www/grupolias/media:/app/media

  db:
    image: postgres:15
    container_name: grupolias_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data: